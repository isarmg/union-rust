name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: validate release workflow gates
        run: sh .github/scripts/test-release-policy.sh

  # ── Core：只支持原生 Linux amd64/arm64；Web Shell 在下方独立验证一次 ───────
  server:
    name: server (linux/${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            uname-machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            uname-machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject an unexpected Core runner
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.uname-machine }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux ]]
          [[ "$(uname -m)" == "$EXPECTED_MACHINE" ]]
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: clippy
        run: cargo clippy --locked -p unionc --all-targets -- -D warnings
      - name: test
        run: cargo test --locked -p unionc

  composition-boundary:
    name: schema-v2 composition boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Assert Core has no business-module Cargo features
        shell: bash
        run: |
          set -euo pipefail
          features="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -cer '.packages[] | select(.name == "unionc") | .features')"
          if [[ "$features" != '{}' ]]; then
            echo "Core must not select business modules through Cargo features: $features" >&2
            exit 1
          fi
      - name: Compile the product-neutral Core graph
        run: cargo check --locked -p unionc --no-default-features --all-targets

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # package.json 的 engines 声明的是支持下限（>=24）；CI 固定到已审核的
          # Node 26 补丁版本，避免同一提交因上游发布而改变构建环境。
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: audit dependencies (high or critical)
        run: npm audit --audit-level=high
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build
