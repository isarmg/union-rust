name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── 服务端：Linux only（lib.rs 有 compile_error! 固定该约束）──────────────
  server:
    name: server (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p unionc --all-targets -- -D warnings
      - name: test
        run: cargo test -p unionc

  # ── Agent：三平台。各平台的采集路径由 #[cfg] 完全隔离，互不重叠。────────
  agent:
    name: agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: resolve Windows MSI version from Cargo metadata
        if: runner.os == 'Windows'
        id: agent_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $agentPackage = @($metadata.packages | Where-Object name -eq "unionc-agent")
          if ($agentPackage.Count -ne 1) {
              throw "cargo metadata did not contain exactly one unionc-agent package."
          }
          $version = $agentPackage[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Windows MSI requires a strict MAJOR.MINOR.PATCH Cargo version; found '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p unionc-agent --all-targets -- -D warnings
      - name: test
        run: cargo test -p unionc-agent
      # 默认只启用原生 NVIDIA 采集；以下矩阵同时覆盖无可选能力与 OTLP 单独启用。
      - name: check (no default features)
        run: cargo check -p unionc-agent --no-default-features --all-targets
      - name: check (otlp only)
        run: cargo check -p unionc-agent --no-default-features --features otlp --all-targets
      - name: check (nvidia only)
        run: cargo check -p unionc-agent --no-default-features --features nvidia --all-targets
      - name: validate Linux packaging lifecycle
        if: runner.os == 'Linux'
        run: sh agent/packaging/linux/test-lifecycle.sh
      - name: build native Windows service, tray companion, and maintenance helper
        if: runner.os == 'Windows'
        run: >-
          cargo build --release -p unionc-agent --target x86_64-pc-windows-msvc
          --bin unionc-agent --bin unionc-agent-maintenance --bin unionc-agent-tray
      - name: verify native Windows PE subsystems
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          function Assert-PeSubsystem {
              param(
                  [Parameter(Mandatory = $true)]
                  [string] $LiteralPath,
                  [Parameter(Mandatory = $true)]
                  [int] $ExpectedSubsystem
              )

              if (-not (Test-Path -LiteralPath $LiteralPath -PathType Leaf)) {
                  throw "PE file does not exist: $LiteralPath"
              }
              $bytes = [System.IO.File]::ReadAllBytes($LiteralPath)
              if ($bytes.Length -lt 64) {
                  throw "PE file is too short to contain a DOS header: $LiteralPath"
              }

              $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
              if ($peOffset -lt 0 -or $peOffset -gt ($bytes.Length - 24)) {
                  throw "PE header offset is outside the file: $LiteralPath"
              }
              if ([System.BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) {
                  throw "PE signature is invalid: $LiteralPath"
              }

              $optionalHeaderSize = [System.BitConverter]::ToUInt16($bytes, $peOffset + 20)
              $optionalHeaderOffset = $peOffset + 24
              if ($optionalHeaderSize -lt 70 -or
                  $optionalHeaderOffset -gt ($bytes.Length - $optionalHeaderSize)) {
                  throw "PE optional header is truncated: $LiteralPath"
              }
              $magic = [System.BitConverter]::ToUInt16($bytes, $optionalHeaderOffset)
              if ($magic -ne 0x010b -and $magic -ne 0x020b) {
                  throw "PE optional header has an unsupported magic value: $LiteralPath"
              }

              $actualSubsystem = [System.BitConverter]::ToUInt16($bytes, $optionalHeaderOffset + 68)
              if ($actualSubsystem -ne $ExpectedSubsystem) {
                  throw "Unexpected PE subsystem for ${LiteralPath}: expected $ExpectedSubsystem, found $actualSubsystem."
              }
              Write-Host "Verified PE subsystem $actualSubsystem for $LiteralPath"
          }

          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release"
          Assert-PeSubsystem `
              -LiteralPath (Join-Path $releaseRoot "unionc-agent.exe") `
              -ExpectedSubsystem 3
          Assert-PeSubsystem `
              -LiteralPath (Join-Path $releaseRoot "unionc-agent-maintenance.exe") `
              -ExpectedSubsystem 2
          Assert-PeSubsystem `
              -LiteralPath (Join-Path $releaseRoot "unionc-agent-tray.exe") `
              -ExpectedSubsystem 2
      - name: validate WiX MSI authoring
        if: runner.os == 'Windows'
        shell: powershell
        run: agent\packaging\windows\tests\Test-WixAuthoring.ps1
      - name: build WiX 4 MSI
        if: runner.os == 'Windows'
        shell: cmd
        env:
          AGENT_VERSION: ${{ steps.agent_version.outputs.version }}
        run: >-
          agent\packaging\windows\wix\build-msi.cmd %AGENT_VERSION%
          target\x86_64-pc-windows-msvc\release\unionc-agent.exe
          target\x86_64-pc-windows-msvc\release\unionc-agent-maintenance.exe
          target\x86_64-pc-windows-msvc\release\unionc-agent-tray.exe
      - name: validate macOS packaging lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sh -n agent/packaging/macos/build-pkg.sh
          sh -n agent/packaging/macos/scripts/preinstall
          sh -n agent/packaging/macos/scripts/postinstall
          sh -n agent/packaging/macos/uninstall.sh
          sh -n agent/packaging/macos/unionc-agent-logrotate
          sh -n agent/packaging/macos/tests/account-safety-test.sh
          plutil -lint agent/packaging/macos/com.unionc.agent.plist
          plutil -lint agent/packaging/macos/com.unionc.agent.logrotate.plist
          sh agent/packaging/macos/tests/account-safety-test.sh

  # ── OTLP 端到端：手写的 protobuf 编码必须由真实 Collector 校验 ───────────────
  #
  # otlp.rs 里 500 行字段编号是手写的，单测只能验证结构、验证不了"对端是否接受"。
  # 必须设置 UNIONC_AGENT_TEST_OTLP_ENDPOINT，否则该测试会静默跳过，
  # 整条导出路径就处于零覆盖状态——下面的 REQUIRE 变量把跳过升级为失败。
  otlp:
    name: otlp end-to-end
    runs-on: ubuntu-latest
    services:
      collector:
        image: otel/opentelemetry-collector-contrib:0.157.0
        ports:
          - 4318:4318
    env:
      UNIONC_AGENT_TEST_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/metrics
      # 缺少端点时直接失败，杜绝"静默跳过 = 全绿"。
      UNIONC_AGENT_TEST_REQUIRE_OTLP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wait for collector
        run: |
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null -w '%{http_code}' \
                 -X POST http://127.0.0.1:4318/v1/metrics \
                 -H 'content-type: application/x-protobuf' --data-binary '' | grep -qE '^(200|400|415)$'; then
              echo "collector is accepting connections"; exit 0
            fi
            sleep 2
          done
          echo "collector did not become ready" >&2; exit 1
      - name: otlp end-to-end
        run: cargo test -p unionc-agent --features otlp --test otlp_live

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # package.json 的 engines 声明的是**支持下限**（>=24），CI 在当前最新的
          # 主版本上验证。engines 不要钉死补丁号——那既与这里的 '26' 不一致，
          # 也会把用 LTS 的贡献者挡在门外。
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: audit dependencies (high or critical)
        run: npm audit --audit-level=high
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build
