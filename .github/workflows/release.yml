name: UnionC release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server-linux:
    name: server (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install static Linux build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Resolve and verify Server version
        id: server_version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "unionc") | .version'
          )"
          if [[ ! "$cargo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Server Cargo version is not strict MAJOR.MINOR.PATCH: $cargo_version" >&2
            exit 1
          fi
          version="$cargo_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "Tag version $version must match Server Cargo version $cargo_version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release Server binary
        run: cargo build --release -p unionc --target x86_64-unknown-linux-musl
      - name: Install pinned nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build Server binary, DEB, and RPM artifacts
        shell: bash
        env:
          SERVER_VERSION: ${{ steps.server_version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          server_binary=target/x86_64-unknown-linux-musl/release/unionc
          test -x "$server_binary"
          if readelf -l "$server_binary" | grep -q 'Requesting program interpreter'; then
            echo "Server release binary must be statically linked for cross-distribution packaging" >&2
            exit 1
          fi
          install -Dm755 "$server_binary" \
            "dist/unionc-server-${SERVER_VERSION}-linux-x86_64"

          # nFPM's source path is intentionally fixed. Stage the already
          # verified musl binary there instead of rebuilding a glibc binary.
          install -Dm755 "$server_binary" target/release/unionc

          nfpm_bin="$(go env GOPATH)/bin/nfpm"
          NFPM_BIN="$nfpm_bin" NFPM_ARCH=amd64 \
            server/packaging/linux/build-packages.sh

          test -x "dist/unionc-server-${SERVER_VERSION}-linux-x86_64"
          deb_dependencies="$(
            dpkg-deb --field "dist/unionc_${SERVER_VERSION}_amd64.deb" Depends
          )"
          grep -Eq '(^|, )passwd($|,)' <<<"$deb_dependencies"
          grep -Eq '(^|, )systemd($|,)' <<<"$deb_dependencies"
          if grep -Eq '(^|, )adduser($|,)' <<<"$deb_dependencies"; then
            echo "Server DEB must depend on passwd, not adduser" >&2
            exit 1
          fi

          current_control="$RUNNER_TEMP/unionc-server-current-control"
          mkdir -p "$current_control"
          dpkg-deb --control \
            "dist/unionc_${SERVER_VERSION}_amd64.deb" "$current_control"
          test ! -e "$current_control/preinst"
          grep -F 'systemctl restart unionc.service' "$current_control/postinst"
          grep -F 'systemctl daemon-reload' "$current_control/postrm"
          dpkg-deb --info "dist/unionc_${SERVER_VERSION}_amd64.deb"
          dpkg-deb --contents "dist/unionc_${SERVER_VERSION}_amd64.deb"
      - name: Smoke test Server DEB, fresh SQLite, same-version reinstall, backup, and restore
        shell: bash
        run: bash server/packaging/linux/tests/smoke-deb.sh --allow-system-changes
      - name: Smoke test Server RPM dependencies, fresh SQLite, and same-version reinstall
        shell: bash
        run: bash server/packaging/linux/tests/smoke-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unionc-server-linux
          path: |
            dist/unionc-server-*-linux-x86_64
            dist/unionc_*.deb
            dist/unionc-*.rpm

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Resolve and verify Agent version
        id: agent_version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "unionc-agent") | .version'
          )"
          if [[ ! "$cargo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Agent Cargo version is not strict MAJOR.MINOR.PATCH: $cargo_version" >&2
            exit 1
          fi
          version="$cargo_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "Tag version $version must match Agent Cargo version $cargo_version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p unionc-agent
      - name: Install pinned nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build portable, DEB, and RPM artifacts from one package definition
        shell: bash
        env:
          AGENT_VERSION: ${{ steps.agent_version.outputs.version }}
        run: |
          set -euo pipefail
          version="$AGENT_VERSION"
          bundle="dist/unionc-agent-linux-x86_64"
          install -Dm755 target/release/unionc-agent "$bundle/unionc-agent"
          install -Dm600 agent/config.example.json "$bundle/config.example.json"
          install -Dm644 agent/packaging/linux/unionc-agent.service "$bundle/unionc-agent.service"
          install -Dm644 agent/packaging/linux/unionc-agent-gpu.conf "$bundle/unionc-agent-gpu.conf"
          install -Dm644 agent/packaging/linux/PORTABLE-README.md "$bundle/README.md"
          tar -C dist -czf dist/unionc-agent-linux-x86_64.tar.gz unionc-agent-linux-x86_64

          nfpm_bin="$(go env GOPATH)/bin/nfpm"
          NFPM_BIN="$nfpm_bin" NFPM_ARCH=amd64 \
            agent/packaging/linux/build-packages.sh

          dpkg-deb --info "dist/unionc-agent_${version}_amd64.deb"
          dpkg-deb --contents "dist/unionc-agent_${version}_amd64.deb"
      - name: Test Linux packaging lifecycle helpers
        run: sh agent/packaging/linux/tests/test-lifecycle.sh
      - name: Smoke test DEB fresh install, ordinary remove, same-version reinstall, and purge
        shell: bash
        run: bash agent/packaging/linux/tests/smoke-deb.sh --allow-system-changes
      - name: Smoke test RPM fresh install, ordinary remove, same-version reinstall, and purge
        shell: bash
        run: bash agent/packaging/linux/tests/smoke-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unionc-agent-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve MSI version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $agentPackage = @($metadata.packages | Where-Object name -eq "unionc-agent")
          if ($agentPackage.Count -ne 1) {
              throw "cargo metadata did not contain exactly one unionc-agent package."
          }
          $version = $agentPackage[0].version
          if ($env:GITHUB_REF -like "refs/tags/v*") {
              $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Windows MSI releases require a strict vMAJOR.MINOR.PATCH tag; found '$version'."
          }
          if ($agentPackage[0].version -ne $version) {
              throw "MSI version $version must exactly match the unionc-agent Cargo package version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build native Windows service, tray companion, and maintenance helper
        run: >-
          cargo build --release -p unionc-agent --target x86_64-pc-windows-msvc
          --bin unionc-agent --bin unionc-agent-maintenance --bin unionc-agent-tray
      - name: Verify native Windows PE subsystems
        shell: powershell
        run: agent\packaging\windows\tests\Test-PeSubsystems.ps1
      - name: Validate WiX MSI authoring
        shell: powershell
        run: agent\packaging\windows\tests\Test-WixAuthoring.ps1
      - name: Build unsigned development MSI
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $agent = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\unionc-agent.exe"
          $helper = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\unionc-agent-maintenance.exe"
          $tray = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\unionc-agent-tray.exe"
          & agent\packaging\windows\wix\build-msi.cmd $env:PRODUCT_VERSION $agent $helper $tray
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI build failed with exit code $LASTEXITCODE." }

          $built = Join-Path $env:GITHUB_WORKSPACE (
              "agent\packaging\windows\wix\bin\x64\Release\UnionC-Agent-{0}-x64.msi" -f $env:PRODUCT_VERSION
          )
          if (-not (Test-Path -LiteralPath $built -PathType Leaf)) {
              throw "WiX did not create the expected MSI: $built"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath $built -Destination (
              "dist\UnionC-Agent-{0}-x64-unsigned-development.msi" -f $env:PRODUCT_VERSION
          )
      - name: Sign native executables, build MSI, and sign MSI
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
              throw "Tagged releases require WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "unionc-windows-signing.pfx"
          [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          )
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password `
              -Exportable:$false)
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate) {
              throw "The Windows signing PFX contains no certificate with a private key."
          }

          try {
              $agent = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\unionc-agent.exe"
              $helper = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\unionc-agent-maintenance.exe"
              $tray = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\unionc-agent-tray.exe"
              foreach ($file in @($agent, $helper, $tray)) {
                  $signature = Set-AuthenticodeSignature `
                      -FilePath $file `
                      -Certificate $certificate `
                      -HashAlgorithm SHA256 `
                      -TimestampServer "http://timestamp.digicert.com"
                  if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                      throw "Authenticode signing failed for ${file}: $($signature.StatusMessage)"
                  }
              }

              # The MSI embeds the signed helper and installs the signed service/tray images.
              & agent\packaging\windows\wix\build-msi.cmd $env:PRODUCT_VERSION $agent $helper $tray
              if ($LASTEXITCODE -ne 0) {
                  throw "WiX MSI build failed with exit code $LASTEXITCODE."
              }
              $msi = Join-Path $env:GITHUB_WORKSPACE (
                  "agent\packaging\windows\wix\bin\x64\Release\UnionC-Agent-{0}-x64.msi" -f $env:PRODUCT_VERSION
              )
              if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
                  throw "WiX did not create the expected MSI: $msi"
              }
              $msiSignature = Set-AuthenticodeSignature `
                  -FilePath $msi `
                  -Certificate $certificate `
                  -HashAlgorithm SHA256 `
                  -TimestampServer "http://timestamp.digicert.com"
              if ($msiSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                  throw "Authenticode signing failed for ${msi}: $($msiSignature.StatusMessage)"
              }

              $allSignatures = @($agent, $helper, $tray, $msi) |
                  ForEach-Object { Get-AuthenticodeSignature -FilePath $_ }
              if (@($allSignatures | Where-Object Status -ne "Valid").Count -ne 0 -or
                  @($allSignatures.SignerCertificate.Thumbprint | Select-Object -Unique).Count -ne 1) {
                  throw "The Agent, tray, maintenance helper, and MSI do not have one valid common signer."
              }
              New-Item -ItemType Directory -Force dist | Out-Null
              $releaseMsi = Join-Path $env:GITHUB_WORKSPACE (
                  "dist\UnionC-Agent-{0}-x64.msi" -f $env:PRODUCT_VERSION
              )
              Copy-Item -LiteralPath $msi -Destination $releaseMsi
          }
          finally {
              foreach ($imported in $certificates) {
                  Remove-Item -LiteralPath ("Cert:\CurrentUser\My\{0}" -f $imported.Thumbprint) `
                      -Force -ErrorAction SilentlyContinue
              }
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke test native Windows MSI lifecycle
        shell: pwsh
        run: >-
          agent\packaging\windows\tests\Test-MsiLifecycle.ps1
          -ProductVersion "${{ steps.version.outputs.version }}"
          -ArtifactDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: unionc-agent-windows
          path: dist/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Resolve and verify Agent version
        id: agent_version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "unionc-agent") | .version'
          )"
          if [[ ! "$cargo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Agent Cargo version is not strict MAJOR.MINOR.PATCH: $cargo_version" >&2
            exit 1
          fi
          version="$cargo_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "Tag version $version must match Agent Cargo version $cargo_version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build universal Agent binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p unionc-agent --no-default-features --features otlp \
            --target aarch64-apple-darwin
          cargo build --release -p unionc-agent --no-default-features --features otlp \
            --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/unionc-agent \
            target/x86_64-apple-darwin/release/unionc-agent \
            -output target/unionc-agent-universal
      - name: Validate macOS packaging files
        shell: bash
        run: sh agent/packaging/macos/tests/validate-packaging.sh
      - name: Build unsigned development pkg
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          AGENT_VERSION: ${{ steps.agent_version.outputs.version }}
        run: |
          set -euo pipefail
          version="$AGENT_VERSION"
          mkdir -p dist
          BINARY="$GITHUB_WORKSPACE/target/unionc-agent-universal" \
            VERSION="$version" \
            OUTPUT="$GITHUB_WORKSPACE/dist/unionc-agent-$version.pkg" \
            agent/packaging/macos/build-pkg.sh
      - name: Build, sign, notarize, and staple tagged pkg
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          AGENT_VERSION: ${{ steps.agent_version.outputs.version }}
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for variable_name in \
            MACOS_SIGNING_P12_BASE64 MACOS_SIGNING_P12_PASSWORD \
            MACOS_APPLICATION_IDENTITY MACOS_INSTALLER_IDENTITY \
            APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Tagged releases require secret $variable_name" >&2
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/unionc-signing.keychain-db"
          certificate="$RUNNER_TEMP/unionc-signing.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          keychain_password="$(uuidgen)$(uuidgen)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$notary_key"
          }
          trap cleanup EXIT

          printf '%s' "$MACOS_SIGNING_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$notary_key"
          chmod 0600 "$certificate" "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            "$HOME/Library/Keychains/login.keychain-db"

          codesign --force --options runtime --timestamp \
            --sign "$MACOS_APPLICATION_IDENTITY" target/unionc-agent-universal
          codesign --verify --deep --strict --verbose=2 target/unionc-agent-universal

          version="$AGENT_VERSION"
          package="$GITHUB_WORKSPACE/dist/unionc-agent-$version.pkg"
          mkdir -p dist
          BINARY="$GITHUB_WORKSPACE/target/unionc-agent-universal" \
            VERSION="$version" OUTPUT="$package" \
            INSTALLER_IDENTITY="$MACOS_INSTALLER_IDENTITY" \
            agent/packaging/macos/build-pkg.sh

          xcrun notarytool submit "$package" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$package"
          xcrun stapler validate "$package"
          pkgutil --check-signature "$package"
          spctl --assess --type install --verbose=4 "$package"
      - name: Smoke test macOS fresh install, same-version reinstall, preserve uninstall, and purge
        shell: bash
        run: bash agent/packaging/macos/tests/smoke-pkg.sh --allow-system-changes
      - uses: actions/upload-artifact@v4
        with:
          name: unionc-agent-macos
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-linux, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      - name: Sign release manifest
        working-directory: dist
        shell: bash
        env:
          LINUX_SIGNING_KEY_BASE64: ${{ secrets.LINUX_SIGNING_KEY_BASE64 }}
          LINUX_SIGNING_KEY_PASSPHRASE: ${{ secrets.LINUX_SIGNING_KEY_PASSPHRASE }}
          LINUX_SIGNING_KEY_FINGERPRINT: ${{ secrets.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          for variable_name in \
            LINUX_SIGNING_KEY_BASE64 LINUX_SIGNING_KEY_PASSPHRASE \
            LINUX_SIGNING_KEY_FINGERPRINT
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Tagged releases require secret $variable_name" >&2
              exit 1
            fi
          done

          signing_home="$(mktemp -d)"
          signing_key="$signing_home/release-key.gpg"
          cleanup() { rm -rf "$signing_home"; }
          trap cleanup EXIT
          chmod 0700 "$signing_home"
          export GNUPGHOME="$signing_home"
          printf '%s' "$LINUX_SIGNING_KEY_BASE64" | base64 --decode > "$signing_key"
          chmod 0600 "$signing_key"
          gpg --batch --import "$signing_key"

          actual_fingerprint="$(
            gpg --batch --with-colons --fingerprint --list-secret-keys \
              | awk -F: '$1 == "fpr" { print toupper($10); exit }'
          )"
          expected_fingerprint="$(
            printf '%s' "$LINUX_SIGNING_KEY_FINGERPRINT" \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"
          if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Imported release key fingerprint does not match LINUX_SIGNING_KEY_FINGERPRINT" >&2
            exit 1
          fi

          printf '%s' "$LINUX_SIGNING_KEY_PASSPHRASE" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --local-user "$actual_fingerprint" \
                --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --armor --export "$actual_fingerprint" > RELEASE-PUBLIC-KEY.asc
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
