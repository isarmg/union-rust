name: Union release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    name: verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require strict release tags from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Manual validation build: no GitHub Release will be created."
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$workspace_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$release_commit" "$main_commit"; then
            echo "Release commit $release_commit is not part of main history." >&2
            exit 1
          fi

  full-ci:
    name: required repository CI
    needs: verify-release-ref
    uses: ./.github/workflows/ci.yml

  build-union:
    name: build official full distribution
    needs: [verify-release-ref, full-ci]
    permissions:
      contents: read
    # Builder v2 owns schema-v2 composition.
    # The reusable workflow and its checkout are pinned to the same immutable reviewed commit.
    uses: isarmg/union-builder/.github/workflows/build-union.yml@59cc5421bc844b0aadf11f52379d9e3e057abeda
    with:
      # Select Builder's versioned official graph instead of duplicating it here.
      profile: full
      artifact-name: union-distribution
      builder-revision: 59cc5421bc844b0aadf11f52379d9e3e057abeda
      materialize-caller-source: true
      caller-revision: ${{ github.sha }}

  release:
    name: publish one Union distribution
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-union
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: union-distribution
          path: dist/builder-artifact
      - name: Extract the mode-preserving Builder payload
        shell: bash
        run: |
          set -euo pipefail
          archive=dist/builder-artifact/union-distribution.tar
          test -f "$archive"
          test ! -L "$archive"
          tar -tf "$archive" | while IFS= read -r entry; do
            case "$entry" in
              union-distribution|union-distribution/*) ;;
              *) echo "unsafe Builder archive entry: $entry" >&2; exit 1 ;;
            esac
            case "/$entry/" in
              */../*) echo "parent traversal in Builder archive: $entry" >&2; exit 1 ;;
            esac
          done
          tar --extract --file "$archive" --directory dist --no-same-owner
      - name: Validate manifest, version, and distribution checksums
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          distribution=dist/union-distribution
          manifest="$distribution/union-release.json"
          test -f "$manifest"
          test -f "$distribution/SHA256SUMS"
          test -x "$distribution/bin/unionc"
          if find "$distribution" ! -type f ! -type d -print -quit | grep -q .; then
            echo "Builder distribution contains a symlink or special file" >&2
            exit 1
          fi
          find "$distribution" -type f ! -name SHA256SUMS -printf '%P\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          sed 's/^[0-9a-f]\{64\}  //' "$distribution/SHA256SUMS" \
            | LC_ALL=C sort > "$RUNNER_TEMP/checksummed-files"
          cmp "$RUNNER_TEMP/actual-files" "$RUNNER_TEMP/checksummed-files"

          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -er '.distribution.version' "$manifest")"
          manifest_name="$(jq -er '.distribution.name' "$manifest")"
          manifest_revision="$(jq -er '.distribution.revision' "$manifest")"
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$manifest_name" != "unionc" ]]; then
            echo "Expected Union distribution name unionc, found $manifest_name" >&2
            exit 1
          fi
          if [[ "$manifest_version" != "$version" ]]; then
            echo "Tag version $version does not match union-release.json version $manifest_version" >&2
            exit 1
          fi
          if [[ "$manifest_revision" != "$release_commit" ]]; then
            echo "Manifest revision $manifest_revision does not match tag commit $release_commit" >&2
            exit 1
          fi
          jq -e '
            .schema_version == 2 and
            ([.modules[].id] | sort) ==
              ["dufs", "host-monitoring", "photo-backup", "sentinel-monitor", "sunshine"]
          ' "$manifest" >/dev/null
          jq -er '.modules[] | [.id, .package, .manifest] | @tsv' "$manifest" |
            while IFS=$'\t' read -r module_id package module_manifest_path; do
            expected_package="modules/$module_id"
            expected_manifest="$expected_package/manifest.json"
            if [[ "$package" != "$expected_package" || "$module_manifest_path" != "$expected_manifest" ]]; then
              echo "Invalid package/manifest location for module $module_id" >&2
              exit 1
            fi

            module_manifest="$distribution/$module_manifest_path"
            test -f "$module_manifest"
            manifest_module_id="$(jq -er '.id' "$module_manifest")"
            if [[ "$manifest_module_id" != "$module_id" ]]; then
              echo "Module manifest identity $manifest_module_id does not match $module_id" >&2
              exit 1
            fi
            executable="$(jq -er '
              if .execution.mode == "process" and
                 (.execution.executable | type == "string" and length > 0)
              then .execution.executable
              else error("module execution must be a process with an executable")
              end
            ' "$module_manifest")"
            case "$executable" in
              /*|..|../*|*/../*|*/..)
                echo "Unsafe executable path for module $module_id: $executable" >&2
                exit 1
                ;;
            esac
            executable_path="$distribution/$package/$executable"
            test -f "$executable_path"
            test -x "$executable_path"
          done
          (
            cd "$distribution"
            sha256sum --check SHA256SUMS
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create reproducible Union archive and outer checksum
        shell: bash
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive_dir="union-${VERSION}-full-linux-x86_64"
          mv dist/union-distribution "dist/$archive_dir"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}^{commit}")"
          bash .github/scripts/create-reproducible-tar.sh \
            "dist/$archive_dir" \
            "dist/$archive_dir.tar.gz" \
            "$source_date_epoch"
          (
            cd dist
            sha256sum "$archive_dir.tar.gz" > SHA256SUMS
          )
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
          RELEASE_CLASSIFICATION: |
            ## Release classification

            This is a formal architecture/build milestone Release. It is **not production-ready** and does not approve production deployment. Production promotion still requires real database/filesystem migration, runtime gateway/media checks, service upgrade, and service/data rollback evidence.
        run: |
          set -euo pipefail
          archive="dist/union-${VERSION}-full-linux-x86_64.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Union ${VERSION}" \
            --notes "$RELEASE_CLASSIFICATION" \
            --generate-notes
