name: Union release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    name: verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require strict release tags from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Manual validation build: no GitHub Release will be created."
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$workspace_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$release_commit" "$main_commit"; then
            echo "Release commit $release_commit is not part of main history." >&2
            exit 1
          fi

  full-ci:
    name: required repository CI
    needs: verify-release-ref
    uses: ./.github/workflows/ci.yml

  build-union:
    name: build official full distribution (${{ matrix.server_target }})
    needs: [verify-release-ref, full-ci]
    strategy:
      fail-fast: false
      matrix:
        server_target: [linux-amd64, linux-arm64]
    permissions:
      contents: read
    # Builder v2 owns schema-v2 composition.
    # The reusable workflow and its checkout are pinned to the same immutable reviewed commit.
    uses: isarmg/union-builder/.github/workflows/build-union.yml@9e965516d87d700850e747301363470ed8ae403e
    with:
      # Select Builder's versioned official graph instead of duplicating it here.
      profile: full
      server-target: ${{ matrix.server_target }}
      artifact-name-prefix: union-distribution
      builder-revision: 9e965516d87d700850e747301363470ed8ae403e
      materialize-caller-source: true
      caller-revision: ${{ github.sha }}

  release:
    name: publish two Linux Union distributions
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-union
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Linux amd64 Builder distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: union-distribution-linux-amd64
          path: dist/builder-artifacts/linux-amd64
      - name: Download Linux arm64 Builder distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: union-distribution-linux-arm64
          path: dist/builder-artifacts/linux-arm64
      - name: Extract the two mode-preserving Builder payloads
        shell: bash
        run: |
          set -euo pipefail
          for server_target in linux-amd64 linux-arm64; do
            artifact="dist/builder-artifacts/$server_target"
            archive="$artifact/union-distribution-$server_target.tar"
            destination="dist/extracted/$server_target"
            test -f "$archive"
            test ! -L "$archive"
            tar -tf "$archive" | while IFS= read -r entry; do
              case "$entry" in
                union-distribution|union-distribution/*) ;;
                *) echo "unsafe Builder archive entry: $entry" >&2; exit 1 ;;
              esac
              case "/$entry/" in
                */../*) echo "parent traversal in Builder archive: $entry" >&2; exit 1 ;;
              esac
            done
            mkdir -p "$destination"
            tar --extract --file "$archive" --directory "$destination" --no-same-owner
          done
      - name: Validate both manifests, architectures, inventories, modes, and checksums
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          for server_target in linux-amd64 linux-arm64; do
            case "$server_target" in
              linux-amd64) expected_architecture=amd64 ;;
              linux-arm64) expected_architecture=arm64 ;;
              *) echo "unsupported server target: $server_target" >&2; exit 1 ;;
            esac
            distribution="dist/extracted/$server_target/union-distribution"
            manifest="$distribution/union-release.json"
            test -f "$manifest"
            test -f "$distribution/SHA256SUMS"
            test -x "$distribution/bin/unionc"
            if find "$distribution" ! -type f ! -type d -print -quit | grep -q .; then
              echo "Builder distribution contains a symlink or special file: $server_target" >&2
              exit 1
            fi
            if find "$distribution" -type f \
              \( -name unionc-agent -o -name 'unionc-agent.*' \) -print -quit | grep -q .; then
              echo "Remote Agent must not be present in a Union server distribution" >&2
              exit 1
            fi
            find "$distribution" -type f ! -name SHA256SUMS -printf '%P\n' \
              | LC_ALL=C sort > "$RUNNER_TEMP/actual-files-$server_target"
            sed 's/^[0-9a-f]\{64\}  //' "$distribution/SHA256SUMS" \
              | LC_ALL=C sort > "$RUNNER_TEMP/checksummed-files-$server_target"
            cmp "$RUNNER_TEMP/actual-files-$server_target" \
              "$RUNNER_TEMP/checksummed-files-$server_target"

            manifest_version="$(jq -er '.distribution.version' "$manifest")"
            manifest_name="$(jq -er '.distribution.name' "$manifest")"
            manifest_revision="$(jq -er '.distribution.revision' "$manifest")"
            manifest_platform="$(jq -er '.distribution.platform' "$manifest")"
            manifest_architecture="$(jq -er '.distribution.architecture' "$manifest")"
            if [[ "$manifest_name" != "unionc" ]]; then
              echo "Expected Union distribution name unionc, found $manifest_name" >&2
              exit 1
            fi
            if [[ "$manifest_version" != "$version" ]]; then
              echo "Tag version $version does not match union-release.json version $manifest_version" >&2
              exit 1
            fi
            if [[ "$manifest_revision" != "$release_commit" ]]; then
              echo "Manifest revision $manifest_revision does not match tag commit $release_commit" >&2
              exit 1
            fi
            if [[ "$manifest_platform" != linux || "$manifest_architecture" != "$expected_architecture" ]]; then
              echo "Manifest target $manifest_platform/$manifest_architecture does not match $server_target" >&2
              exit 1
            fi
            jq -e '
              .schema_version == 2 and
              ([.modules[].id] | sort) ==
                ["dufs", "host-monitoring", "photo-backup", "sentinel-monitor", "sunshine"]
            ' "$manifest" >/dev/null
            jq -er '.modules[] | [.id, .package, .manifest] | @tsv' "$manifest" |
              while IFS=$'\t' read -r module_id package module_manifest_path; do
              expected_package="modules/$module_id"
              expected_manifest="$expected_package/manifest.json"
              if [[ "$package" != "$expected_package" || "$module_manifest_path" != "$expected_manifest" ]]; then
                echo "Invalid package/manifest location for module $module_id" >&2
                exit 1
              fi

              module_manifest="$distribution/$module_manifest_path"
              test -f "$module_manifest"
              manifest_module_id="$(jq -er '.id' "$module_manifest")"
              if [[ "$manifest_module_id" != "$module_id" ]]; then
                echo "Module manifest identity $manifest_module_id does not match $module_id" >&2
                exit 1
              fi
              executable="$(jq -er '
                if .execution.mode == "process" and
                   (.execution.executable | type == "string" and length > 0)
                then .execution.executable
                else error("module execution must be a process with an executable")
                end
              ' "$module_manifest")"
              case "$executable" in
                /*|..|../*|*/../*|*/..)
                  echo "Unsafe executable path for module $module_id: $executable" >&2
                  exit 1
                  ;;
              esac
              executable_path="$distribution/$package/$executable"
              test -f "$executable_path"
              test -x "$executable_path"
            done
            (
              cd "$distribution"
              sha256sum --check SHA256SUMS
            )
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create two reproducible Union archives and one outer checksum manifest
        shell: bash
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}^{commit}")"
          for server_target in linux-amd64 linux-arm64; do
            archive_dir="union-${VERSION}-full-${server_target}"
            mv "dist/extracted/$server_target/union-distribution" "dist/$archive_dir"
            bash .github/scripts/create-reproducible-tar.sh \
              "dist/$archive_dir" \
              "dist/$archive_dir.tar.gz" \
              "$source_date_epoch"
          done
          (
            cd dist
            sha256sum \
              "union-${VERSION}-full-linux-amd64.tar.gz" \
              "union-${VERSION}-full-linux-arm64.tar.gz" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
          RELEASE_CLASSIFICATION: |
            ## Release classification

            This is a formal architecture/build milestone Release. It is **not production-ready** and does not approve production deployment. Production promotion still requires real database/filesystem migration, runtime gateway/media checks, service upgrade, and service/data rollback evidence.
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/union-${VERSION}-full-linux-amd64.tar.gz" \
            "dist/union-${VERSION}-full-linux-arm64.tar.gz" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Union ${VERSION}" \
            --notes "$RELEASE_CLASSIFICATION" \
            --generate-notes
