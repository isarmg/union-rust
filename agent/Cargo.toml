[package]
name = "unionc-agent"
description = "Read-only cross-platform host telemetry agent for UnionC"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Native NVIDIA collection remains the packaged default. OTLP is an optional
# secondary export and must be selected explicitly with `--features otlp`.
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]
# OTLP 导出。手写的 protobuf 子集在 `otlp.rs`，由专用测试对真实 Collector 验证。
# flate2 也一并门控：关掉 otlp 时不应把 gzip 编码器编进二进制。
otlp = ["dep:prost", "dep:flate2"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
flate2 = { version = "1", optional = true }
nvml-wrapper = { version = "0.12", optional = true }
prost = { version = "0.14", optional = true }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"] }
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
unionc-protocol.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking"] }
sha1 = "0.10"
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
tokio = { version = "1", features = ["test-util"] }

[[test]]
name = "otlp_encoding"
required-features = ["otlp"]

[[test]]
name = "otlp_live"
required-features = ["otlp"]
