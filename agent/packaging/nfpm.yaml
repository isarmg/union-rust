name: unionc-agent
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: UnionC
description: Read-only cross-platform host telemetry agent for UnionC
license: MIT OR Apache-2.0
overrides:
  deb:
    # useradd/groupadd/userdel/groupdel are provided by passwd on Debian-family
    # systems; systemctl and the unit runtime come from systemd.
    depends:
      - passwd
      - systemd
      - util-linux
  rpm:
    # The same account tools use the shadow-utils package name on RPM-family
    # systems.
    depends:
      - shadow-utils
      - systemd
      - util-linux
# ⚠ 必须从**工作区根**执行：
#   cargo build --release --workspace
#   NFPM_ARCH=amd64 agent/packaging/linux/build-packages.sh
# build-packages.sh 从 Cargo 读取唯一当前版本，并在调用 nFPM 前核对二进制与
# config.example.json；不要直接给本文件注入任意 VERSION。
# 合并为 Cargo workspace 后产物在根 target/，路径因此全部根相对。
#
# ⚠⚠ 不要在 `contents[].src` 里写 `${VAR}`——nfpm 不对该字段做环境变量展开，
# 详见 server/packaging/nfpm.yaml 顶部的说明（那里记录了实测的失败信息）。
#
# 交叉编译的产物请先落到 target/release/ 再打包，例如：
#   cargo build --release -p unionc-agent --target aarch64-unknown-linux-gnu
#   install -Dm755 target/aarch64-unknown-linux-gnu/release/unionc-agent target/release/unionc-agent
contents:
  - src: ./target/release/unionc-agent
    dst: /usr/bin/unionc-agent
    file_info:
      mode: 0755
  - src: ./agent/config.example.json
    dst: /etc/unionc-agent/config.json
    type: config|noreplace
    file_info:
      mode: 0600
  - src: ./agent/packaging/linux/unionc-agent.service
    dst: /usr/lib/systemd/system/unionc-agent.service
  # GPU drop-in：默认构建启用 nvidia feature，但 unit 里 PrivateDevices=yes 会挡住
  # NVML 需要的 /dev/nvidia*，装了包却读不到 GPU。该文件必须**随包分发**——只留在
  # 源码树里的话，装 deb/rpm 的用户根本拿不到，表现为"GPU 采集静默不可用"。
  # 启用方式在 postinstall 中说明。
  - src: ./agent/packaging/linux/unionc-agent-gpu.conf
    dst: /usr/share/unionc-agent/unionc-agent-gpu.conf
  - src: ./agent/packaging/linux/purge-local-state.sh
    dst: /usr/sbin/unionc-agent-purge
    file_info:
      mode: 0755
scripts:
  postinstall: ./agent/packaging/linux/postinstall.sh
  preremove: ./agent/packaging/linux/preremove.sh
  postremove: ./agent/packaging/linux/postremove.sh
