[workspace]
resolver = "3"
members = ["server", "agent", "protocol"]

# Server 与 Agent 此前是各自独立的 package，各有一份 Cargo.lock，每条命令都要写两遍
# `--manifest-path`。合并为 workspace 后：一次 `cargo test` 覆盖全部、一份锁文件、
# 共享的依赖版本与发布 profile；protocol crate 则承载两端唯一的线上 DTO 定义。
#
# 注意：server 仅支持 Linux（lib.rs 有 compile_error! 固定），agent 跨三平台。
# 在非 Linux 上构建 agent 时需显式指定 `-p unionc-agent`，否则 workspace 默认
# 成员会把 server 也拉进来。

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"

# Workspace 成员共用的依赖在此统一版本，避免同一个库出现多个版本各自编译一遍。
[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
unionc-protocol = { path = "protocol" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
