[workspace]
resolver = "3"
members = [
  "server",
]

# 该 workspace 只拥有产品中立的 Core；业务 worker 与远端 companion 均由各自仓库
# 独立验证。正式服务器发行图由 Union Builder 以不可变 revision 组合。

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"

# Workspace 成员共用的依赖在此统一版本，避免同一个库出现多个版本各自编译一遍。
[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = { version = "2", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
